[package]
name = "k-float"
version = "0.1.0"
edition = "2021"
description = "Opens always-on-top desktop windows (system webview) from spec files. Helper for the k-float mod SDK."
license = "MIT"
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
